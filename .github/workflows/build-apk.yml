name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor & CLI
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Patil Infratech" "com.patil.infratech" --web-dir .

      - name: Configure Streamlit Web URL
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.patil.infratech",
            "appName": "Patil Infratech",
            "webDir": ".",
            "server": {
              "url": "https://patilinfra1-gpdharashiv.streamlit.app",
              "cleartext": true
            }
          }
          EOF

      - name: Add Android Platform
        run: npx cap add android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patil-Infratech-APK
          path: android/app/build/outputs/apk/debug/*.apk
